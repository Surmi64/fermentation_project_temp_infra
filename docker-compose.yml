services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: coffee-mqtt
    ports:
      - "1884:1883"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: coffee-grafana
    ports:
      - "3000:3001"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - mqtt
