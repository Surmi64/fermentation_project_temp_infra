[agent]
  interval = "2s"
  flush_interval = "5s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["coffee/sensor/+/temperature"]
  data_format = "value"
  data_type = "float"
  name_override = "temperature"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "coffee/sensor/+/temperature"
    tags = "_/_/probe/_"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["coffee/session/elapsed"]
  data_format = "value"
  data_type = "integer"
  name_override = "session_elapsed"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["coffee/device/rssi"]
  data_format = "value"
  data_type = "integer"
  name_override = "wifi_rssi"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["coffee/device/ip"]
  data_format = "value"
  data_type = "string"
  name_override = "device_ip"
